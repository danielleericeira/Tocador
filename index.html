<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Cantinho Retrô ♡ Blog & Interações</title>
    <style>
        /* Estilo Geral e Configurações de Rolagem Livre */
        html {
            scroll-behavior: smooth;
        }
        
        body {
            background-color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            color: #1a1a1a;
            overflow-x: hidden;
        }

        /* --- HEADER E NAVBAR FIXA --- */
        .header-bar {
            position: fixed;
            top: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
            box-sizing: border-box;
            background-color: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            z-index: 90;
            border-bottom: 1px solid #eaeaea;
        }

        .logo-area { display: flex; align-items: center; gap: 12px; }
        .logo-title { font-weight: bold; font-size: 16px; color: #1a1a1a; }
        .logo-subtitle { font-size: 12px; color: #ff85a2; font-weight: 500; }

        .nav-dropdown-container { position: relative; display: inline-block; }
        .player-status-btn {
            background: #f0f0f0; border: 1px solid #e0e0e0; border-radius: 20px;
            padding: 8px 16px; font-size: 13px; font-weight: 500; color: #333;
            display: flex; align-items: center; gap: 10px; cursor: pointer;
        }
        .player-status-btn span.bold { font-weight: bold; background: #fff; padding: 2px 8px; border-radius: 12px; border: 1px solid #ddd; }
        
        .dropdown-content {
            display: none; position: absolute; right: 0; top: 105%;
            background-color: #ffffff; min-width: 150px; box-shadow: 0px 8px 24px rgba(0,0,0,0.12);
            border-radius: 12px; border: 1px solid #eaeaea; padding: 8px 0; z-index: 101;
        }
        .dropdown-content a {
            color: #1a1a1a; padding: 10px 20px; text-decoration: none; display: block;
            font-size: 14px; font-weight: 600; cursor: pointer;
        }
        .dropdown-content a:hover { background-color: #fff0f5; color: #ff85a2; }
        .nav-dropdown-container:hover .dropdown-content { display: block; }

        /* --- SEÇÕES COM ROLAGEM CONTÍNUA NORMAL --- */
        .section {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 120px 40px 60px 40px;
            box-sizing: border-box;
            position: relative;
        }

        #home { background-color: #ffdeeb; }
        #services-section { background-color: #000000; color: #ffffff; } /* Preto igual ao Papers */
        #blog { background-color: #f7e1ed; border-top: 1px solid #eaeaea; }
        #connect-section { background-color: #ffffff; border-top: 1px solid #eaeaea; }

        /* --- TELA FLUTUANTE MODAL: SOBRE MIM (Só abre por clique) --- */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background-color: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(8px);
            z-index: 200;
            display: none; /* Escondida por padrão */
            align-items: center;
            justify-content: center;
        }
        .modal-overlay.modal-open { display: flex; }

        .about-modal-card {
            background-color: white; color: #1a1a1a;
            border-radius: 20px; padding: 40px; max-width: 800px; width: 90%;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            position: relative; display: flex; gap: 40px;
        }
        .close-modal-btn {
            position: absolute; top: 20px; right: 20px;
            background: #f0f0f0; border: none; font-size: 18px;
            width: 35px; height: 35px; border-radius: 50%; cursor: pointer;
        }

        .profile-circle { width: 150px; height: 150px; border-radius: 50%; object-fit: cover; border: 2px solid #ddd; }

        /* --- INTERAÇÃO 1: NOTA FISCAL DE SERVIÇOS --- */
        .services-wrapper {
            display: flex; align-items: center; justify-content: center;
            gap: 50px; width: 100%; max-width: 900px; margin-top: 30px;
        }

        .invoice-box {
            position: relative; cursor: pointer; width: 260px;
        }

        .invoice-paper {
            background-color: #e5e5e5; background-image: radial-gradient(#d5d5d5 10%, transparent 11%); background-size: 4px 4px;
            color: #111; padding: 25px 20px; font-family: 'Courier New', monospace;
            border: 1px solid #ccc; box-shadow: 5px 5px 15px rgba(0,0,0,0.3);
            border-bottom: 8px dashed #000; /* Efeito picotado embaixo */
        }

        /* Estrela vermelha de click explosiva */
        .click-badge {
            position: absolute; top: 30%; left: -20px;
            background-color: #e60000; color: white; font-weight: 900; font-size: 11px;
            padding: 15px 8px; text-align: center; clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
            opacity: 0; transform: scale(0.5); transition: 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 10; animation: pulseBadge 1s infinite alternate;
        }
        .invoice-box:hover .click-badge { opacity: 1; transform: scale(1); }

        @keyframes pulseBadge { 0% { transform: scale(1); } 100% { transform: scale(1.1); } }

        /* Painel explicativo lateral (Escondido, aparece no clique) */
        .services-details-panel {
            background-color: #111; border: 1px solid #333; border-radius: 12px;
            padding: 30px; width: 450px; display: none; flex-direction: column; gap: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        .services-details-panel.panel-active { display: flex; }

        /* --- INTERAÇÃO 2: TICKET QUE RASGA --- */
        .ticket-container {
            position: relative; width: 550px; height: 180px;
            display: flex; gap: 10px; cursor: pointer; margin-top: 40px;
        }

        .ticket-part {
            background-color: #f5f5f5; color: #111; box-sizing: border-box;
            border: 2px solid #4a4a4a; padding: 20px; transition: transform 0.4s ease-out;
            background-image: radial-gradient(circle, #fff 10%, transparent 15%); background-size: 6px 6px;
        }

        .ticket-left {
            width: 380px; border-radius: 12px 0 0 12px; border-right: 3px dashed #999;
            display: flex; flex-direction: column; justify-content: space-between;
        }

        .ticket-right {
            width: 160px; border-radius: 0 12px 12px 0;
            display: flex; flex-direction: column; justify-content: space-between; align-items: center;
        }

        /* Quando passa o mouse, o ticket "se rasga" se afastando */
        .ticket-container:hover .ticket-left { transform: translateX(-20px) rotate(-1deg); }
        .ticket-container:hover .ticket-right { transform: translateX(20px) rotate(1deg); }

        .diga-oi-badge {
            position: absolute; right: -25px; top: 35%;
            background-color: #e60000; color: white; font-weight: 900; font-size: 10px;
            padding: 15px 12px; clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
            opacity: 0; transition: 0.3s; z-index: 10;
        }
        .ticket-container:hover .diga-oi-badge { opacity: 1; }

        /* --- INTERAÇÃO 3: FORMULÁRIO DE CONTATO FLUTUANTE INTERFACE --- */
        .contact-form-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background-color: rgba(0,0,0,0.85); z-index: 300;
            display: none; align-items: center; justify-content: center;
        }
        .contact-form-overlay.form-open { display: flex; }

        .form-window {
            width: 600px; color: white; padding: 30px; display: flex; flex-direction: column; gap: 20px;
        }

        .form-row { display: flex; gap: 20px; }
        .form-group { flex: 1; display: flex; flex-direction: column; gap: 5px; }
        .form-group label { font-size: 11px; font-weight: bold; color: #aaa; text-transform: uppercase; }
        .form-group input, .form-group textarea {
            background: none; border: none; border-bottom: 1px solid #fff; padding: 10px 0;
            color: white; font-size: 15px; font-family: inherit; outline: none;
        }
        .form-group textarea { height: 80px; resize: none; }

        .send-btn {
            background-color: white; color: black; border: none; padding: 14px;
            border-radius: 25px; font-weight: bold; font-size: 14px; cursor: pointer; margin-top: 20px;
        }

        /* Outros estilos reutilizados do player e do carrossel de discos */
        .tabs { display: flex; gap: 6px; margin-bottom: -3px; z-index: 1; }
        .tab-btn { background-color: #f0a8c4; border: 3px solid #4a4a4a; border-bottom: none; padding: 10px 16px; cursor: pointer; font-family: 'Courier New', monospace; font-weight: bold; border-radius: 10px 10px 0 0; color: white; }
        .tab-btn.active { background-color: #fff0f5; color: #4a4a4a; padding-bottom: 13px; }
        .player-container { background-color: #fff0f5; border: 3px solid #4a4a4a; border-radius: 14px; padding: 30px; width: 400px; height: 300px; box-shadow: 6px 6px 0px #4a4a4a; display: flex; flex-direction: column; align-items: center; justify-content: space-between; }
        .tab-content { display: none; width: 100%; height: 80%; flex-direction: column; align-items: center; justify-content: center; }
        .tab-content.active { display: flex; }
        .cassette { background-color: #4facfe; border: 3px solid #4a4a4a; width: 240px; height: 140px; border-radius: 10px; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .cassette-label { background-color: white; border: 3px solid #4a4a4a; width: 180px; height: 85px; border-radius: 6px; display: flex; flex-direction: column; align-items: center; justify-content: space-around; }
        .cassette-wheels { display: flex; gap: 45px; background-color: #e0e0e0; padding: 5px 15px; border-radius: 20px; border: 2px solid #4a4a4a; }
        .wheel { width: 25px; height: 25px; background-color: #4a4a4a; border-radius: 50%; border: 4px dashed #fff; }
        .crt-monitor { background-color: #dedede; border: 4px solid #4a4a4a; border-radius: 20px 20px 10px 10px; padding: 15px 15px 25px 15px; width: 250px; }
        .crt-screen { background-color: #0f1f11; border: 4px solid #7a7a7a; border-radius: 14px; height: 110px; color: #33ff33; font-size: 12px; display: flex; flex-direction: column; justify-content: center; align-items: center; font-family: 'Courier New', monospace; }
        .discman { background-color: #cdb4db; border: 4px solid #4a4a4a; width: 180px; height: 180px; border-radius: 50%; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; }
        .discman-window { width: 115px; height: 115px; background-color: rgba(255, 255, 255, 0.25); border: 3px solid #4a4a4a; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
        .cd-disc { width: 95px; height: 95px; background: radial-gradient(circle, #4a4a4a 8%, #fff 10%, #e0aaff 30%, #9d4edd 50%, #fff 85%); border: 2px solid #4a4a4a; border-radius: 50%; }
        .controls { display: flex; gap: 15px; }
        .btn { background-color: #fff; border: 3px solid #4a4a4a; padding: 10px 22px; cursor: pointer; font-weight: bold; font-family: 'Courier New', monospace; border-radius: 8px; box-shadow: 3px 3px 0px #4a4a
