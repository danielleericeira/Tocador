<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nosso Player Retrô Perfeito ♡</title>
    <style>
        /* Estilo Geral - Cores Pastel e Pixel-Art Feel */
        body {
            background-color: #ffdeeb;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            color: #4a4a4a;
            user-select: none;
        }

        h1 {
            font-size: 26px;
            margin-bottom: 25px;
            text-shadow: 2px 2px 0px white;
            font-weight: bold;
            letter-spacing: -1px;
        }

        /* Container das 3 Abas Estilo Fichário */
        .tabs {
            display: flex;
            gap: 6px;
            margin-bottom: -3px;
            z-index: 1;
        }

        .tab-btn {
            background-color: #f0a8c4;
            border: 3px solid #4a4a4a;
            border-bottom: none;
            padding: 10px 16px;
            cursor: pointer;
            font-family: inherit;
            font-weight: bold;
            border-radius: 10px 10px 0 0;
            color: white;
            box-shadow: inset -2px 3px 0px rgba(255,255,255,0.3);
            transition: all 0.2s;
            font-size: 14px;
        }

        .tab-btn:hover {
            background-color: #f3b9cf;
            transform: translateY(-2px);
        }

        .tab-btn.active {
            background-color: #fff0f5;
            color: #4a4a4a;
            padding-bottom: 13px;
            transform: translateY(0);
            box-shadow: none;
        }

        /* Moldura Principal do Player */
        .player-container {
            background-color: #fff0f5;
            border: 3px solid #4a4a4a;
            border-radius: 14px;
            padding: 30px;
            width: 400px;
            height: 300px;
            box-shadow: 6px 6px 0px #4a4a4a;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            position: relative;
        }

        .tab-content {
            display: none;
            width: 100%;
            height: 80%;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .tab-content.active {
            display: flex;
        }

        /* --- ABA 1: FITA CASSETE (Melhorada) --- */
        .cassette {
            background-color: #4facfe;
            border: 3px solid #4a4a4a;
            width: 240px;
            height: 140px;
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: inset -6px -6px 0px rgba(0,0,0,0.15), inset 6px 6px 0px rgba(255,255,255,0.2);
            position: relative;
        }

        .cassette-label {
            background-color: white;
            border: 3px solid #4a4a4a;
            width: 180px;
            height: 85px;
            border-radius: 6px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-around;
            box-shadow: 2px 2px 0px rgba(0,0,0,0.05);
        }

        .cassette-wheels {
            display: flex;
            gap: 45px;
            background-color: #e0e0e0;
            padding: 5px 15px;
            border-radius: 20px;
            border: 2px solid #4a4a4a;
        }

        .wheel {
            width: 25px;
            height: 25px;
            background-color: #4a4a4a;
            border-radius: 50%;
            border: 4px dashed #fff;
            box-shadow: inset 0px 0px 3px black;
        }

        /* --- ABA 2: COMPUTADOR DE TUBO CRT (Visual Incrível) --- */
        .crt-monitor {
            background-color: #dedede;
            border: 4px solid #4a4a4a;
            border-radius: 20px 20px 10px 10px;
            padding: 15px 15px 25px 15px;
            width: 250px;
            box-shadow: inset -5px -5px 0px #b8b8b8, inset 5px 5px 0px #fff, 4px 4px 0px rgba(0,0,0,0.1);
            position: relative;
        }

        /* Tela de fósforo verde com scanlines */
        .crt-screen {
            background-color: #0f1f11;
            border: 4px solid #7a7a7a;
            border-radius: 14px;
            height: 110px;
            color: #33ff33;
            font-size: 13px;
            font-weight: bold;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            box-shadow: inset 0px 0px 15px black;
            overflow: hidden;
        }

        /* Efeito de linhas de TV antiga de tubo */
        .crt-screen::before {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 2;
            background-size: 100% 4px, 6px 100%;
            pointer-events: none;
        }

        .crt-button {
            width: 12px;
            height: 12px;
            background-color: #ff4444;
            border: 2px solid #4a4a4a;
            border-radius: 50%;
            position: absolute;
            bottom: 6px;
            right: 25px;
            cursor: pointer;
            box-shadow: 1px 1px 0px #fff;
        }

        .playing .crt-button {
            background-color: #33ff33; /* Fica verde quando ligado */
            box-shadow: 0 0 5px #33ff33;
        }

        /* --- ABA 3: TOCA-CDS REDONDO (DISCMAN) --- */
        .discman {
            background-color: #cdb4db;
            border: 4px solid #4a4a4a;
            width: 180px;
            height: 180px;
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: inset -8px -8px 0px rgba(0,0,0,0.15), inset 4px 4px 0px rgba(255,255,255,0.4);
            position: relative;
        }

        .discman-window {
            width: 115px;
            height: 115px;
            background-color: rgba(255, 255, 255, 0.25);
            border: 3px solid #4a4a4a;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(1px);
            box-shadow: inset 2px 2px 5px rgba(0,0,0,0.2);
        }

        .cd-disc {
            width: 95px;
            height: 95px;
            background: radial-gradient(circle, #4a4a4a 8%, #fff 10%, #e0aaff 30%, #9d4edd 50%, #fff 85%);
            border: 2px solid #4a4a4a;
            border-radius: 50%;
            position: relative;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.1);
        }

        .cd-center {
            width: 22px;
            height: 22px;
            background-color: #fff;
            border: 2px solid #4a4a4a;
            border-radius: 50%;
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
        }

        /* Visor Digital do Discman */
        .discman-screen {
            background-color: #aaccff;
            border: 2px solid #4a4a4a;
            font-size: 11px;
            font-weight: bold;
            padding: 3px 8px;
            position: absolute;
            bottom: 8px;
            border-radius: 4px;
            box-shadow: inset 1px 1px 2px rgba(0,0,0,0.2);
            color: #112244;
        }

        /* --- LOGIC DE ANIMAÇÕES --- */
        .playing .wheel {
            animation: spin 2.5s linear infinite;
        }

        .playing .cd-disc {
            animation: spin 0.8s linear infinite;
        }

        .playing .crt-screen {
            text-shadow: 0 0 6px #33ff33;
        }

        @keyframes spin {
            100% { transform: rotate(360deg); }
        }

        /* Botões de Controle Inferiores */
        .controls {
            display: flex;
            gap: 15px;
            margin-top: 10px;
        }

        .btn {
            background-color: #fff;
            border: 3px solid #4a4a4a;
            padding: 10px 22px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
            font-family: inherit;
            border-radius: 8px;
            box-shadow: 3px 3px 0px #4a4a4a;
            transition: 0.1s;
        }

        .btn:active {
            box-shadow: 0px 0px 0px #4a4a4a;
            transform: translate(3px, 3px);
        }
    </style>
</head>
<body>

    <h1>Nosso Player Retrô Perfeito ♫</h1>

    <!-- Seleção das 3 Abas solicitadas -->
    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('cassette-tab')">📼 Fita Cassete</button>
        <button class="tab-btn" onclick="switchTab('crt-tab')">📺 PC de Tubo</button>
        <button class="tab-btn" onclick="switchTab('cd-tab')">💿 Toca CDs</button>
    </div>

    <!-- Container Principal do Player -->
    <div class="player-container" id="player">
        
        <!-- ABA 1: FITA CASSETE -->
        <div id="cassette-tab" class="tab-content active">
            <div class="cassette">
                <div class="cassette-label">
                    <span style="font-size: 11px; font-weight: bold; letter-spacing: 1px;">LO-FI TRACK.01</span>
                    <div class="cassette-wheels">
                        <div class="wheel"></div>
                        <div class="wheel"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- ABA 2: COMPUTADOR DE TUBO (CRT) -->
        <div id="crt-tab" class="tab-content">
            <div class="crt-monitor">
                <div class="crt-screen">
                    <span style="letter-spacing: 2px; margin-bottom: 6px;">[MONITOR CRT]</span>
                    <span id="crt-status">> STATUS: IDLE</span>
                    <span style="font-size: 10px; margin-top: 8px; color: #88ff88;">Awaiting play...</span>
                </div>
                <div class="crt-button"></div>
            </div>
        </div>

        <!-- ABA 3: TOCA-CDS (DISCMAN) -->
        <div id="cd-tab" class="tab-content">
            <div class="discman">
                <div class="discman-window">
                    <div class="cd-disc">
                        <div class="cd-center"></div>
                    </div>
                </div>
                <div class="discman-screen" id="cd-screen-text">00 00:00</div>
            </div>
        </div>

        <!-- Controle Único de Play -->
        <div class="controls">
            <button class="btn" id="playBtn" onclick="togglePlay()">▶ PLAY</button>
        </div>
    </div>

    <script>
        let isPlaying = false;

        // Troca de Abas Inteligente
        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            
            document.getElementById(tabId).classList.add('active');
            event.currentTarget.classList.add('active');
        }

        // Ativa/Desativa o estado de tocando
        function togglePlay() {
            isPlaying = !isPlaying;
            const playerContainer = document.getElementById('player');
            const playBtn = document.getElementById('playBtn');
            const crtStatus = document.getElementById('crt-status');
            const cdScreenText = document.getElementById('cd-screen-text');

            if (isPlaying) {
                playerContainer.classList.add('playing');
                playBtn.style.backgroundColor = "#ffccd5";
                playBtn.innerText = "⏸ PAUSE";
                crtStatus.innerText = "> STATUS: PLAYING";
                cdScreenText.innerText = "TR 01 02:45";
            } else {
                playerContainer.classList.remove('playing');
                playBtn.style.backgroundColor = "#fff";
                playBtn.innerText = "▶ PLAY";
                crtStatus.innerText = "> STATUS: PAUSED";
                cdScreenText.innerText = "TR 01 PAUSE";
            }
        }
    </script>
</body>
</html>
